name: Original engine checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Original and integration regressions
        run: python -X utf8 -m unittest discover -s 引擎/tests
      - name: API entry startup
        run: python -X utf8 引擎/text_input.py --help
      - name: Original offline writer
        run: python -X utf8 tools/demo.py --output outputs/ci-demo
      - name: Check public source
        run: python -X utf8 tools/check_public.py --tracked
      - name: Build and verify source ZIP
        run: python -X utf8 tools/build_package.py --output outputs/ci-source.zip
