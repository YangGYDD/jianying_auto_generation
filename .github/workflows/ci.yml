name: Offline tests and public package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned build tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install project
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: First-run checks
        run: nvbatch doctor
      - name: Run offline example
        run: nvbatch demo --output outputs/ci-demo
      - name: Verify saved offline manifest
        run: nvbatch verify outputs/ci-demo
      - name: Public source and tracked-file check
        run: python tools/check_public.py --tracked
      - name: Public package smoke
        run: python tools/build_package.py --output outputs/ci-public.zip
      - name: Build wheel and source distribution
        run: python -c "from setuptools.build_meta import build_wheel, build_sdist; build_wheel('dist'); build_sdist('dist')"
      - name: Check every built distribution
        run: python -c "from pathlib import Path; from tools.check_public import ROOT, collect_public, check_distribution; files = collect_public(ROOT); [(print(p.name, check_distribution(p, files))) for p in Path('dist').iterdir()]"
      - name: Install wheel
        run: python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('*.whl')); subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', '--force-reinstall', str(wheel)], check=True)"
      - name: Run installed wheel outside checkout and verify saved manifest
        run: python -c "import subprocess, sys, tempfile; from pathlib import Path; d = tempfile.mkdtemp(); output = str(Path(d) / 'demo'); subprocess.run([sys.executable, '-m', 'news_video_batch', 'demo', '--output', output], cwd=d, check=True); subprocess.run([sys.executable, '-m', 'news_video_batch', 'verify', output], cwd=d, check=True)"
